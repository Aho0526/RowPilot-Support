<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志願理由書添削</title>
  <meta name="description" content="志願理由書の添削・レビューを効率化する支援ツール">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts: Inter + Noto Sans JP + Noto Serif JP (清書用明朝) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Marked.js (Markdown パーサー) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="css/app.css?v=1.7_indent_fix">
</head>

<body>
  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p>読み込み中...</p>
  </div>

  <!-- アプリヘッダー -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" class="header-logo" aria-label="RowPilot ホームへ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </a>
      <span class="header-separator" aria-hidden="true">/</span>
      <h1 class="header-title">
        <span id="sop-title">志願理由書</span>
        <span class="header-subtitle">添削支援</span>
      </h1>
    </div>

    <div class="header-center">
      <div class="mode-toggle" role="group" aria-label="表示モード切替">
        <button id="btn-mode-student" class="mode-btn mode-btn--active" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          生徒モード
        </button>
        <button id="btn-mode-teacher" class="mode-btn" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          先生モード
        </button>
      </div>
    </div>

    <div class="header-right">
      <span id="role-badge" class="role-badge role-badge--student">生徒モード</span>
    </div>
  </header>

  <!-- メインレイアウト（2カラム） -->
  <main class="app-main">

    <!-- 左パネル: 志願理由書 -->
    <section class="panel panel-sop" aria-label="志願理由書">
      <div class="panel-header" style="justify-content: flex-start; gap: 10px;">
        <h2 class="panel-title" style="margin-right: 4px;">志願理由書</h2>

        <!-- ビュー切り替えタブ -->
        <div class="panel-tabs" role="tablist" aria-label="表示ビュー切替">
          <button id="btn-view-paper" class="panel-tab panel-tab--active" role="tab" aria-selected="true"
            title="実際の志願理由書用紙に直接入力・閲覧">
            📄 清書ビュー
          </button>
          <button id="btn-view-text" class="panel-tab" role="tab" aria-selected="false" title="シンプルなテキストエディタ">
            📝 文字のみ
          </button>
        </div>

        <div class="panel-meta" id="sop-meta-info" style="margin-left: auto;">
          <span id="char-count" class="char-count">0 字</span>
          <span id="save-status" class="save-status status--saved">保存済み</span>
          <span id="last-request-time" class="last-request-time"
            style="font-size: 11px; color: var(--color-text-muted);"></span>
          <button id="btn-print-sop" class="btn-print" title="A4印刷・PDFとして保存" aria-label="印刷">
            🖨️ 印刷
          </button>
        </div>
      </div>
      <div class="panel-body panel-body--editor">
        <!-- 1. 清書ビュー（公式PDF用紙スタイル） -->
        <div id="view-paper-container" class="sop-paper-scroll-wrap">
          <div class="sop-paper-sheet" id="sop-paper-sheet">
            <!-- 公式PDFの上に重ねる入力フィールド群 -->
            <input type="text" id="sop-input-receipt" class="sop-overlay-input sop-field-receipt" maxlength="12"
              aria-label="受付番号">

            <input type="text" id="sop-input-furigana" class="sop-overlay-input sop-field-furigana" placeholder="ふりがな"
              aria-label="フリガナ">
            <input type="text" id="sop-input-name" class="sop-overlay-input sop-field-name" placeholder="氏名"
              aria-label="氏名">

            <input type="text" id="sop-input-school" class="sop-overlay-input sop-field-school" placeholder="出身高校名"
              aria-label="学校名">
            <input type="text" id="sop-input-highschool-dept" class="sop-overlay-input sop-field-highschool-dept"
              placeholder="普通科など" aria-label="高校学科名">

            <input type="text" id="sop-input-exam-type" class="sop-overlay-input sop-field-exam-type"
              placeholder="選抜名（例: 学校推薦型選抜（指定校制）〔一般入学〕）" aria-label="入学者選抜名">

            <input type="text" id="sop-input-faculty" class="sop-overlay-input sop-field-faculty" placeholder="工"
              aria-label="志望学部">
            <input type="text" id="sop-input-dept" class="sop-overlay-input sop-field-dept" placeholder="情報システム"
              aria-label="志望学科">
            <input type="text" id="sop-input-course" class="sop-overlay-input sop-field-course" placeholder="コース名"
              aria-label="コース名">

            <!-- 4つの設問入力欄（PDFの点線5行に揃える） -->
            <div class="sop-section-overlay sop-section-overlay-1">
              <div id="sop-guide-1" class="sop-comment-guide" aria-hidden="true"></div>
              <textarea id="sop-section-1" class="sop-overlay-textarea" rows="5" aria-label="志望理由"></textarea>
            </div>

            <div class="sop-section-overlay sop-section-overlay-2">
              <div id="sop-guide-2" class="sop-comment-guide" aria-hidden="true"></div>
              <textarea id="sop-section-2" class="sop-overlay-textarea" rows="5" aria-label="勉学や活動の内容"></textarea>
            </div>

            <div class="sop-section-overlay sop-section-overlay-3">
              <div id="sop-guide-3" class="sop-comment-guide" aria-hidden="true"></div>
              <textarea id="sop-section-3" class="sop-overlay-textarea" rows="5"
                aria-label="本学に入学して取り組みたいこと"></textarea>
            </div>

            <div class="sop-section-overlay sop-section-overlay-4">
              <div id="sop-guide-4" class="sop-comment-guide" aria-hidden="true"></div>
              <textarea id="sop-section-4" class="sop-overlay-textarea" rows="5" aria-label="大学卒業後を見据えた目標"></textarea>
            </div>
          </div>
        </div>

        <!-- 2. 文字のみビュー（シンプルエディタ） -->
        <div id="view-text-container" class="sop-text-wrapper" style="display: none;">
          <textarea id="sop-textarea" class="essay-textarea" placeholder="ここに志願理由書を入力してください..."
            spellcheck="false"></textarea>
        </div>
      </div>
    </section>

    <div class="panel-divider" aria-hidden="true" data-divider="0"></div>

    <!-- 右パネル: 先生からのコメント -->
    <section class="panel panel-comments" aria-label="先生からのコメント">
      <div class="panel-header">
        <h2 class="panel-title">先生からのコメント</h2>
      </div>
      <div class="panel-body panel-body--comments">
        <div id="comments-container" class="comments-container"></div>
      </div>
    </section>

  </main>

  <!-- ボトムツールバー -->
  <footer class="app-toolbar">
    <div class="toolbar-left">
      <span class="hint-text text-muted">編集内容は自動的に保存されます</span>
    </div>
    <div class="toolbar-right">
      <button id="btn-request-review" class="toolbar-btn toolbar-btn--primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
        レビュー依頼
      </button>

      <button id="btn-submit-review" class="toolbar-btn toolbar-btn--primary" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        レビュー提出
      </button>

      <span id="app-build-tag" class="app-build-tag"
        style="font-size: 11px; color: var(--color-text-muted); opacity: 0.8; margin-left: 12px; font-variant-numeric: tabular-nums;">v1.7
        (9.4 22:00)</span>
    </div>
  </footer>

  <script type="module" src="js/app.js?v=1.7_indent_fix"></script>
</body>

</html>
