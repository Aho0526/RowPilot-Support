<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体験入学 スペースインベーダー — RowPilot</title>
    <meta http-equiv="refresh" content="0; url=/dev/trial-admission/">
    <link rel="canonical" href="https://rowpilot.jp/dev/trial-admission/">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .redirect-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn-link:hover {
            opacity: 0.9;
        }
    </style>
    <script>
        // 即時リダイレクト
        (function() {
            var target = '/dev/trial-admission/' + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <div class="redirect-card">
        <h1>スペースインベーダー スタジオへ移動中...</h1>
        <p>画面が切り替わらない場合は下のボタンをクリックしてください。</p>
        <a href="/dev/trial-admission/" class="btn-link">体験入学ページを開く</a>
    </div>
</body>
</html>
