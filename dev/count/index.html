<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>受付カウンター</title>
  <link rel="icon" href="/pictures/tOLEOe7OiEqYmjh1765190733_1765190737.png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <h1 class="title">受付カウンター</h1>
        <div class="sync-info">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">同期済</span>
          <span id="syncTimer" style="margin-left: 2px;">(次回 05:00)</span>
          <button id="btnSyncNow" class="btn-text">更新</button>
        </div>
      </div>
      <div class="header-right">
        <button id="btnOpenReport" class="btn-report" aria-label="累計と履歴を表示">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>累計・履歴</span>
        </button>
      </div>
    </header>

    <!-- メインカウンターカード -->
    <main class="counter-card">
      <!-- ゲーム選択セグメント -->
      <div class="game-selector" role="radiogroup" aria-label="ゲーム選択">
        <button class="game-btn active" data-game="コインピッチ" role="radio" aria-checked="true">コインピッチ</button>
        <button class="game-btn" data-game="タブトス" role="radio" aria-checked="false">タブトス</button>
      </div>

      <!-- 人数 -->
      <div class="counter-row">
        <div class="row-label">来客人数</div>
        <div class="stepper">
          <button id="btnPeopleMinus" class="btn-step" aria-label="1人減らす">−</button>
          <div class="step-value">
            <span id="displayPeople">1</span><span class="unit">人</span>
          </div>
          <button id="btnPeoplePlus" class="btn-step" aria-label="1人増やす">＋</button>
        </div>
      </div>

      <!-- 回数 -->
      <div class="counter-row">
        <div class="row-label">プレイ回数</div>
        <div class="stepper">
          <button id="btnPlaysMinus" class="btn-step" aria-label="1回減らす">−</button>
          <div class="step-value">
            <span id="displayPlays">1</span><span class="unit">回</span>
          </div>
          <button id="btnPlaysPlus" class="btn-step" aria-label="1回増やす">＋</button>
        </div>
      </div>

      <!-- 金額表示 -->
      <div class="amount-box">
        <div class="amount-label">会計金額</div>
        <div class="amount-val">
          <span class="currency">¥</span><span id="previewTotalAmount">100</span>
        </div>
        <div class="amount-sub" id="priceFormula">1人 × 1回 (1回100円)</div>
      </div>

      <!-- 任意メモ -->
      <div class="note-box">
        <input type="text" id="inputNote" placeholder="メモ（任意）" maxlength="50">
      </div>

      <!-- アクションボタン -->
      <div class="actions">
        <button id="btnResetCurrent" class="btn-secondary" title="入力をリセット">クリア</button>
        <button id="btnSaveAndComplete" class="btn-primary">
          <span id="btnSaveText">保存して完了 (¥100)</span>
        </button>
      </div>
    </main>
  </div>

  <!-- 累計・履歴シート (モーダル) -->
  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
    <div class="sheet-container" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-header">
        <h2 id="sheetTitle">累計・履歴</h2>
        <div class="sheet-header-actions">
          <button id="btnExportCsv" class="btn-text">CSV保存</button>
          <button id="btnCloseReport" class="btn-close" aria-label="閉じる">✕</button>
        </div>
      </div>

      <div class="sheet-content">
        <!-- 全体累計サマリー -->
        <div class="summary-grid">
          <div class="summary-item">
            <div class="sum-label">全体累計人数</div>
            <div class="sum-num"><span id="statTotalPeople">0</span>人</div>
          </div>
          <div class="summary-item">
            <div class="sum-label">全体プレイ</div>
            <div class="sum-num"><span id="statTotalPlays">0</span>回</div>
          </div>
          <div class="summary-item highlight">
            <div class="sum-label">全体売上</div>
            <div class="sum-num">¥<span id="statTotalRevenue">0</span></div>
          </div>
        </div>

        <!-- ゲーム別内訳 -->
        <div class="games-breakdown">
          <div class="game-breakdown-card gb-card--coin">
            <div class="gb-title">コインピッチ</div>
            <div class="gb-val">¥<span id="statCoinRevenue">0</span></div>
            <div class="gb-sub"><span id="statCoinPeople">0</span>人 / <span id="statCoinPlays">0</span>回</div>
          </div>
          <div class="game-breakdown-card gb-card--tabtos">
            <div class="gb-title">タブトス</div>
            <div class="gb-val">¥<span id="statTabtosRevenue">0</span></div>
            <div class="gb-sub"><span id="statTabtosPeople">0</span>人 / <span id="statTabtosPlays">0</span>回</div>
          </div>
        </div>

        <!-- 履歴ブロック -->
        <div class="history-block">
          <div class="history-block-title">
            <span>記録一覧</span>
            <span class="count-pill" id="historyCount">0件</span>
          </div>
          <div class="history-list" id="historyList">
            <div class="history-empty">データを読み込んでいます...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト通知コンテナ -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
