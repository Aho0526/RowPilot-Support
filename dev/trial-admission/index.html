<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体験入学 - オリジナルゲームを作ろう！</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>スペースインベーダーを作ろう！</h1>
        <p>VSCodeで <code>config.js</code> と <code>style.css</code> を編集して、ゲームを改造してみよう。</p>
        <p>操作: [←] [→] で移動、[Space] で弾を発射</p>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- 設定ファイル（体験入学生が編集するファイル） -->
    <script src="config.js"></script>
    
    <!-- コアファイル（編集不要） -->
    <script src="core.js"></script>
</body>
</html>
