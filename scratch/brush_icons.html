<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #0b0f17; color: #fff; font-family: -apple-system, sans-serif; padding: 30px; }
.sidebar-mock { width: 230px; background: #0f141c; border: 1px solid #1e2633; padding: 8px 0; border-radius: 6px; }
.tree-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; color: #cbd5e1; }
.tree-row:hover { background: rgba(255, 255, 255, 0.05); }
.tree-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; color: #38bdf8; flex-shrink: 0; }
.big-box { display: flex; gap: 40px; margin-bottom: 24px; }
.card { background: #161e2b; padding: 16px; border-radius: 8px; text-align: center; }
.big-svg { width: 64px; height: 64px; color: #38bdf8; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="big-box" style="flex-wrap: wrap;">
  <div class="card">
    <div style="margin-bottom:8px; font-weight:600;">F. 【推奨1】お手本黄金比（柄長め・ふっくら穂先）</div>
    <div class="big-svg">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 柄（真っ直ぐでクッキリ） -->
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 L10.5 10.5 Z"></path>
        <!-- 穂先（ふっくら膨らんで先端へ） -->
        <path d="M10.5 10.5 C8 11.5 4.5 16 2 22 C8 19.5 12.5 16 13.5 13.5"></path>
      </svg>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px; font-weight:600;">G. 【推奨2】F＋先端インクベタ（お手本完全一致）</div>
    <div class="big-svg">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 柄 -->
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 L10.5 10.5 Z"></path>
        <!-- 穂先外枠 -->
        <path d="M10.5 10.5 C8 11.5 4.5 16 2 22 C8 19.5 12.5 16 13.5 13.5"></path>
        <!-- 先端インク塗り -->
        <path d="M2 22 C5 17 6.5 18 8 16 C6.5 20.5 2 22 2 22" fill="currentColor"></path>
      </svg>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px; font-weight:600;">H. 【推奨3】一筆書き輪郭（境界線なし・概観重視）</div>
    <div class="big-svg">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 C12 16 7.5 19.5 2 22 C4.5 16.5 8 12 10.5 10.5 Z"></path>
      </svg>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px; font-weight:600;">A. （前回候補A）柄短め</div>
    <div class="big-svg">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.5 2.5 L21.5 5.5 L13 14 L10 11 Z"></path>
        <path d="M10 11 C8 12.5 5 16.5 2 22 C7.5 19 11.5 16 13 14"></path>
      </svg>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px; font-weight:600;">E. （現在）前回の筆</div>
    <div class="big-svg">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 13 19 4 22 7 13 16"></polyline>
        <polyline points="8.5 11.5 14.5 17.5"></polyline>
        <polyline points="10 13 6.5 14.5 1 23 9.5 17.5 13 16"></polyline>
        <polyline points="5 17 6.5 16 7.5 18 9 17"></polyline>
      </svg>
    </div>
  </div>
</div>

<h3>実寸（サイドバー 16px）での表示比較</h3>
<div class="sidebar-mock" style="width: 300px;">
  <div class="tree-row">
    <span class="tree-icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 L10.5 10.5 Z"></path>
        <path d="M10.5 10.5 C8 11.5 4.5 16 2 22 C8 19.5 12.5 16 13.5 13.5"></path>
      </svg>
    </span>
    <span>F. お手本黄金比（線画シンプル）</span>
  </div>

  <div class="tree-row">
    <span class="tree-icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 L10.5 10.5 Z"></path>
        <path d="M10.5 10.5 C8 11.5 4.5 16 2 22 C8 19.5 12.5 16 13.5 13.5"></path>
        <path d="M2 22 C5 17 6.5 18 8 16 C6.5 20.5 2 22 2 22" fill="currentColor"></path>
      </svg>
    </span>
    <span>G. 先端インク塗りあり</span>
  </div>

  <div class="tree-row">
    <span class="tree-icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 1.5 L22.5 4.5 L13.5 13.5 C12 16 7.5 19.5 2 22 C4.5 16.5 8 12 10.5 10.5 Z"></path>
      </svg>
    </span>
    <span>H. 一筆書き輪郭（すっきり）</span>
  </div>

  <div class="tree-row">
    <span class="tree-icon">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="10 13 19 4 22 7 13 16"></polyline>
        <polyline points="8.5 11.5 14.5 17.5"></polyline>
        <polyline points="10 13 6.5 14.5 1 23 9.5 17.5 13 16"></polyline>
        <polyline points="5 17 6.5 16 7.5 18 9 17"></polyline>
      </svg>
    </span>
    <span>E. 現在の筆（比較用）</span>
  </div>
</div>

</body>
</html>
